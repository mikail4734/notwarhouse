<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteShare | Profesyonel Not Editörü</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <style>
        .ql-toolbar.ql-snow { border: none; border-bottom: 1px solid #f1f5f9; position: sticky; top: 0; background: white; z-index: 40; }
        .ql-container.ql-snow { border: none; font-size: 1.1rem; }
        .ql-editor { min-height: 500px; padding: 2rem; background: white; }
        .lang-bridge { padding-top: 12px; margin-top: -4px; }

        /* Focus Mode (Tam Ekran) Ayarları */
        body.focus-mode nav { display: none !important; }
        body.focus-mode main { max-width: 100% !important; margin-top: 0 !important; padding: 0 !important; }
        body.focus-mode .bg-white.rounded-3xl { border-radius: 0 !important; border: none !important; }
        body.focus-mode .ql-editor { min-height: 100vh; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 transition-all duration-300">

    <nav id="mainNav" class="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
        <div class="flex items-center space-x-4">
            <a href="html2.html" class="text-slate-400 hover:text-indigo-600 transition text-xl"><i class="fas fa-arrow-left"></i></a>
            <h1 id="navTitle" class="font-bold text-xl tracking-tight text-indigo-600 italic">NoteShare Editor</h1>
        </div>
        
        <div class="flex items-center">
            <div class="relative inline-block text-left mr-6 group">
                <button class="flex items-center space-x-2 bg-slate-100 px-4 py-2 rounded-full hover:bg-slate-200 transition h-10 border border-transparent">
                    <i class="fas fa-globe text-indigo-600"></i>
                    <span id="currentLangDisplay" class="text-sm font-bold uppercase">TR</span>
                    <i class="fas fa-chevron-down text-[10px] text-slate-400"></i>
                </button>
                <div class="absolute right-0 top-full hidden group-hover:block z-[60] lang-bridge w-32">
                    <div class="bg-white rounded-xl shadow-2xl border border-slate-100 py-1 overflow-hidden">
                        <button onclick="changeLanguage('tr')" class="w-full text-left px-4 py-3 text-sm hover:bg-indigo-50 transition border-b border-slate-50">🇹🇷 Türkçe</button>
                        <button onclick="changeLanguage('en')" class="w-full text-left px-4 py-3 text-sm hover:bg-indigo-50 transition border-b border-slate-50">🇺🇸 English</button>
                        <button onclick="changeLanguage('de')" class="w-full text-left px-4 py-3 text-sm hover:bg-indigo-50 transition">🇩🇪 Deutsch</button>
                    </div>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button onclick="downloadNote()" class="text-slate-600 bg-slate-100 px-4 py-2 rounded-full font-semibold hover:bg-slate-200 transition hidden md:block">
                    <i class="fas fa-file-download mr-2"></i> <span class="btnDownloadText">İndir</span>
                </button>
                <button onclick="saveToDatabase()" class="bg-emerald-500 text-white px-6 py-2 rounded-full font-bold hover:bg-emerald-600 shadow-md transition active:scale-95">
                    <i class="fas fa-save mr-2"></i> <span id="btnSaveText">Kaydet</span>
                </button>
                <button onclick="openShareModal()" class="bg-indigo-600 text-white px-6 py-2 rounded-full font-bold hover:bg-indigo-700 shadow-md transition active:scale-95">
                    <i class="fas fa-share-alt mr-2"></i> <span id="btnShareText">Paylaş</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto max-w-4xl mt-10 mb-20 px-4 relative">
        <button onclick="toggleFocusMode()" class="absolute right-8 top-12 z-[45] bg-white/80 backdrop-blur text-slate-400 hover:text-indigo-600 w-10 h-10 rounded-xl shadow-sm border border-slate-100 transition-all flex items-center justify-center">
            <i id="focusIcon" class="fas fa-expand-arrows-alt"></i>
        </button>

        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
            <div id="editorHeader" class="p-6 bg-slate-50 border-b flex flex-wrap gap-4">
                <div class="flex-1 min-w-[200px]">
                    <label id="labelLevel" class="block text-[10px] font-black text-slate-400 uppercase mb-1 tracking-widest">Eğitim Seviyesi</label>
                    <select id="level" class="w-full bg-white border-none rounded-lg p-2 text-sm shadow-sm ring-1 ring-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="Ilkokul">İlkokul</option>
                        <option value="Ortaokul">Ortaokul</option>
                        <option value="Lise">Lise</option>
                        <option value="Universite">Üniversite</option>
                    </select>
                </div>
                <div class="flex-1 min-w-[200px]">
                    <label id="labelSubject" class="block text-[10px] font-black text-slate-400 uppercase mb-1 tracking-widest">Ders / Bölüm Adı</label>
                    <input type="text" id="subject" placeholder="Örn: Matematik" class="w-full bg-white border-none rounded-lg p-2 text-sm shadow-sm ring-1 ring-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>

            <div class="px-8 pt-8">
                <input type="text" id="title" placeholder="Not Başlığını Buraya Girin..." 
                       class="w-full text-4xl font-black placeholder-slate-200 focus:outline-none border-b-2 border-transparent focus:border-indigo-100 pb-4 transition-all">
            </div>

            <div id="editor"></div>
        </div>
    </main>

    <div id="shareModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-8 scale-95 transition-transform duration-300">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-slate-800">Paylaş</h3>
                <button onclick="closeShareModal()" class="text-slate-400 hover:text-red-500 transition"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="grid grid-cols-3 gap-4 mb-8">
                <button onclick="share('whatsapp')" class="flex flex-col items-center group">
                    <div class="w-14 h-14 bg-green-100 text-green-600 rounded-2xl flex items-center justify-center text-2xl group-hover:bg-green-600 group-hover:text-white transition-all"><i class="fab fa-whatsapp"></i></div>
                    <span class="text-[10px] mt-2 font-bold text-slate-400">WHATSAPP</span>
                </button>
                <button onclick="share('twitter')" class="flex flex-col items-center group">
                    <div class="w-14 h-14 bg-slate-100 text-slate-900 rounded-2xl flex items-center justify-center text-2xl group-hover:bg-black group-hover:text-white transition-all"><i class="fab fa-x-twitter"></i></div>
                    <span class="text-[10px] mt-2 font-bold text-slate-400">TWITTER</span>
                </button>
                <button onclick="share('telegram')" class="flex flex-col items-center group">
                    <div class="w-14 h-14 bg-blue-100 text-blue-500 rounded-2xl flex items-center justify-center text-2xl group-hover:bg-blue-500 group-hover:text-white transition-all"><i class="fab fa-telegram-plane"></i></div>
                    <span class="text-[10px] mt-2 font-bold text-slate-400">TELEGRAM</span>
                </button>
            </div>
            <div class="relative">
                <input type="text" id="shareLink" readonly class="w-full bg-slate-50 border rounded-xl py-3 px-4 text-[10px] text-slate-500 outline-none">
                <button onclick="copyLink()" class="absolute right-2 top-2 bg-indigo-600 text-white text-[10px] px-2 py-1 rounded-lg">Kopyala</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        const translations = {
            'tr': { 'navTitle': 'NoteShare Editör', 'btnSave': 'Kaydet', 'btnShare': 'Paylaş', 'labelL': 'Eğitim Seviyesi', 'labelS': 'Ders / Bölüm Adı', 'phTitle': 'Not Başlığını Buraya Girin...', 'phEditor': 'Yazmaya başla...' },
            'en': { 'navTitle': 'NoteShare Editor', 'btnSave': 'Save', 'btnShare': 'Share', 'labelL': 'Education Level', 'labelS': 'Subject Name', 'phTitle': 'Enter Title Here...', 'phEditor': 'Start writing...' },
            'de': { 'navTitle': 'NoteShare Editor', 'btnSave': 'Speichern', 'btnShare': 'Teilen', 'labelL': 'Bildungsstufe', 'labelS': 'Fachname', 'phTitle': 'Titel eingeben...', 'phEditor': 'Schreiben...' }
        };

        function changeLanguage(lang) {
            document.getElementById('currentLangDisplay').innerText = lang.toUpperCase();
            const t = translations[lang];
            document.getElementById('navTitle').innerText = t.navTitle;
            document.getElementById('btnSaveText').innerText = t.btnSave;
            document.getElementById('btnShareText').innerText = t.btnShare;
            document.getElementById('labelLevel').innerText = t.labelL;
            document.getElementById('labelSubject').innerText = t.labelS;
            document.getElementById('title').placeholder = t.phTitle;
            quill.root.dataset.placeholder = t.phEditor;
            localStorage.setItem('prefLang', lang);
        }

        var quill = new Quill('#editor', {
            theme: 'snow',
            placeholder: 'Notlarını buraya yaz...',
            modules: { toolbar: [[{ 'header': [1, 2, false] }], ['bold', 'italic', 'underline'], [{ 'list': 'ordered'}, { 'list': 'bullet' }], ['image', 'code-block', 'clean']] }
        });

        function toggleFocusMode() {
            document.body.classList.toggle('focus-mode');
            const icon = document.getElementById('focusIcon');
            const header = document.getElementById('editorHeader');
            if(document.body.classList.contains('focus-mode')) {
                icon.classList.replace('fa-expand-arrows-alt', 'fa-compress-arrows-alt');
                header.classList.add('hidden');
            } else {
                icon.classList.replace('fa-compress-arrows-alt', 'fa-expand-arrows-alt');
                header.classList.remove('hidden');
            }
        }

        function saveToDatabase() {
            const title = document.getElementById('title').value;
            const content = quill.root.innerHTML;
            if(!title || !content || content === "<p><br></p>") {
                alert("Lütfen bir başlık ve içerik yazın!");
                return;
            }
            const formData = new FormData();
            formData.append('title', title);
            formData.append('content', content);
            formData.append('level', document.getElementById('level').value);
            formData.append('subject', document.getElementById('subject').value);

            fetch('not_kaydet.php', { method: 'POST', body: formData })
            .then(res => res.text())
            .then(() => {
                alert("✅ Not başarıyla kaydedildi!");
                window.location.href = "matematik-notlari.php";
            }).catch(e => alert("Hata: " + e));
        }

        function openShareModal() {
            document.getElementById('shareLink').value = window.location.href;
            document.getElementById('shareModal').classList.remove('hidden');
        }

        function closeShareModal() {
            document.getElementById('shareModal').classList.add('hidden');
        }

        function share(platform) {
            const url = window.location.href;
            const title = document.getElementById('title').value || "NoteShare Notu";
            let shareUrl = '';
            if(platform === 'whatsapp') shareUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(title + ": " + url)}`;
            if(platform === 'twitter') shareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`;
            if(platform === 'telegram') shareUrl = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}`;
            window.open(shareUrl, '_blank');
        }

        function copyLink() {
            const copyText = document.getElementById("shareLink");
            copyText.select();
            document.execCommand("copy");
            alert("Bağlantı kopyalandı!");
        }

        function downloadNote() {
            const blob = new Blob([quill.root.innerHTML], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = (document.getElementById('title').value || 'not') + '.html';
            a.click();
        }

        window.onload = () => {
            changeLanguage(localStorage.getItem('prefLang') || 'tr');
        };
    </script>
</body>
</html>
